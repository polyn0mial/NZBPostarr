<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">NZBPostarr</title>
  <desc id="desc">Prepare, post and submit NZBs from one self-hosted web UI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Self-contained dark card, so contrast holds on both GitHub themes. -->
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#bg)" stroke="#334155" stroke-width="2"/>

  <!-- Mark: a stack of article segments flowing up into a post. -->
  <g transform="translate(150 150)">
    <circle r="78" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <rect x="-40" y="16" width="80" height="12" rx="6" fill="#38bdf8" opacity="0.55"/>
    <rect x="-40" y="-4" width="80" height="12" rx="6" fill="#60a5fa" opacity="0.75"/>
    <rect x="-40" y="-24" width="80" height="12" rx="6" fill="#818cf8"/>
    <path d="M0 -58 L22 -36 H8 V-30 H-8 V-36 H-22 Z" fill="#e2e8f0"/>
  </g>

  <text x="270" y="150" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1">NZB<tspan fill="url(#accent)">Postarr</tspan></text>
  <text x="274" y="202" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27">Prepare, post and submit NZBs from one self-hosted web UI</text>
  <rect x="274" y="228" width="120" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
