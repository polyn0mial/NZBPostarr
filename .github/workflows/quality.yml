name: Quality

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Both jobs run on the self-hosted OVH runner, not GitHub-hosted infra, so
  # CI stays free instead of spending the private-repo Actions minutes
  # allowance. That runner is capped at 4 cpus / 6 GB and fenced off the
  # host's mail ports; it has no docker socket, so nothing here may use
  # container:, service containers, or docker; it has git, curl, python3.12,
  # tar, unzip, jq but no gcc/make, so a dependency needing a build from
  # source will fail there. If the runner is ever offline, GitHub queues the
  # run instead of failing it.
  backend:
    runs-on: [self-hosted, linux, ovh]
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the documented minimum in README.md and AGENTS.md; test it so
        # the floor is enforced rather than merely asserted.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --group dev

      - name: Compile production modules
        run: python -m compileall -q app.py main.py setup.py version.py core logic

      # Steps below that inspect the tree or the lockfile rather than the
      # interpreter only need to run once, not once per matrix entry.
      - name: Check public release tree
        if: matrix.python-version == '3.13'
        run: python .github/release.py check

      - name: Scan tracked content for secrets
        if: matrix.python-version == '3.13'
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner .

      - name: Lint
        if: matrix.python-version == '3.13'
        run: ruff check app.py main.py setup.py version.py core logic .github/*.py tests

      - name: Type-check the enforced frontier
        run: mypy

      - name: Test
        run: pytest tests -q

      - name: Audit Python runtime dependencies
        if: matrix.python-version == '3.13'
        run: pip-audit -r requirements.lock

  frontend:
    runs-on: [self-hosted, linux, ovh]
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install supported npm audit client
        run: npm install --global npm@11.18.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Verify generated assets are current
        working-directory: .
        run: git diff --exit-code -- webui/assets
