name: Quality

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --group dev

      - name: Compile production modules
        run: python -m compileall -q app.py main.py setup.py version.py core logic

      - name: Check public release tree
        run: python .github/release.py check

      - name: Scan tracked content for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner .

      - name: Lint
        run: ruff check app.py main.py setup.py version.py core logic .github/*.py tests

      - name: Type-check the enforced frontier
        run: mypy

      - name: Test
        run: pytest tests -q

      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install supported npm audit client
        run: npm install --global npm@11.18.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Verify generated assets are current
        working-directory: .
        run: git diff --exit-code -- webui/assets
