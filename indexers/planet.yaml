# NZBPlanet Indexer Definition
# https://api.nzbplanet.net

id: planet
name: NZBPlanet
description: NZBPlanet indexer with newznab API
website: https://nzbplanet.net
favicon_url: https://nzbplanet.net/views/images/favicon.ico
search_url: https://nzbplanet.net/search/{poster}
api_key: '' # Set in config.yaml
icon: globe-2
color: '#2563eb'

# API Configuration
submit_url: https://api.nzbplanet.net/api
method: POST

# Authentication
auth:
  method: query_param
  api_key_param: apikey

# Category Mapping (newznab standard)
categories:
  tv: '5040' # TV/HD
  movie: '2040' # Movies/HD
  movie_sd: '2030' # Movies/SD
  movie_hd: '2040' # Movies/HD
  movie_uhd: '2045' # Movies/UHD
  movie_dvd: '2070' # Movies/DVD
  anime: '5070' # TV/Anime
  music: '3010' # Audio/MP3
  books: '7020' # Books/Ebook
  apps: '' # No trusted explicit app mapping configured
  misc: '5000' # TV/Other
  default: ''
category_param: cat

# Extra params
extra_params:
  t: nzbadd

# Release name
name_param: name

# File Upload Fields
# NOTE: NZBPlanet does NOT support NFO uploads - sending an 'nfo' multipart
# field causes "Missing parameter" (error 200). Only the NZB file is accepted.
files:
  nzb: file
  nzb_mime: application/x-nzb

# Success Detection
success:
  text_patterns:
    - '<success'
    - '<SUCCESS'
    - 'CODE="601"'
    - 'item added'
  duplicate_patterns:
    - 'duplicate'
    - 'already exists'
    - DUPLICATE

timeout: 30
