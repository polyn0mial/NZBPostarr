[tool.mypy]
cache_dir = ".local/cache/mypy"
files = [
  "api/mcp.py",
  "core/auth.py",
  "core/redaction.py",
  "core/format.py",
  "core/fs.py",
  "core/logging.py",
  "core/media.py",
  "core/paths.py",
  "core/proc.py",
  "core/scheduler.py",
  "core/tools.py",
  "logic/classify/anime.py",
  "logic/pending/index.py",
  "logic/system/reaper.py",
  "logic/stats/process_stats.py",
  "logic/queue_metrics.py",
  "logic/pipeline/posting.py",
  "logic/pipeline/submit.py",
  "logic/stream/__init__.py",
  "logic/stream/manifest.py",
  "logic/stream/monitors.py",
  "logic/stream/nntp.py",
  "logic/stream/nzb.py",
  "logic/stream/repost.py",
  ".github/release.py",
]
follow_imports = "skip"
strict = true

# This explicit file list is the checked type frontier. New or remediated
# modules should be added here; existing untyped orchestration remains outside
# the release gate until its contracts have been narrowed.

[[tool.mypy.overrides]]
# The MCP SDK is an optional extra and is deliberately absent from
# requirements.lock, so it is never installed in the CI type-check environment.
# APScheduler ships no py.typed marker.
module = ["mcp.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
cache_dir = ".local/cache/pytest"

[tool.ruff]
cache-dir = ".local/cache/ruff"

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-base-url==2.1.0",
  "pytest-playwright==0.7.2",
  "playwright==1.61.0",
  "ruff==0.14.10",
  "mypy==2.1.0",
  "types-psutil==7.2.2.20260518",
  "pip-audit==2.10.1",
]
