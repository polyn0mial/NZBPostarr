            <!-- Toolbar -->
            <div class="px-3 py-2 bg-notion-bg-secondary/50 border-b border-notion-divider flex flex-wrap items-center justify-start gap-2">
                <!-- Search + Literal -->
                <div class="toolbar-search-row">
                    <div class="relative search-input-wrap flex-1 min-w-[150px] sm:min-w-[200px]">
                        <lucide-icon name="search" icon-class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-notion-text-tertiary"></lucide-icon>
                        <input
                            type="text"
                            v-model="searchQuery"
                            placeholder="Search items..."
                            class="pl-9 pr-3 py-1.5 w-full bg-notion-bg-secondary border border-notion-border rounded-md text-xs text-notion-text-primary placeholder:text-notion-text-placeholder focus:border-notion-accent focus:outline-none h-[36px] sm:h-[32px]" />
                    </div>
                    <label class="flex items-center gap-1.5 text-xs text-notion-text-tertiary cursor-pointer h-[36px] sm:h-[32px] px-2 rounded-md hover:bg-notion-bg-hover transition-colors shrink-0" title="Search for exact text including dots, dashes, underscores">
                        <input type="checkbox" v-model="literalSearch" class="w-4 h-4 rounded border-notion-border bg-notion-bg-secondary text-notion-accent" />
                        <span class="hidden xs:inline">Literal</span>
                    </label>
                </div>

                <div class="flex items-center gap-2">
                    <!-- Category Filter -->
                    <div v-show="categoryFilterOpen" class="fixed inset-0 z-[190]" @click="categoryFilterOpen = false"></div>
                    <div>
                        <button
                            @click="openCategoryFilter($event)"
                            :class="selectedCategorySet.has('all') ? 'border-notion-border text-notion-text-secondary' : 'border-notion-accent text-notion-accent'"
                            class="px-3 py-1.5 bg-notion-bg-secondary border rounded-md text-xs hover:bg-notion-bg-hover transition-colors flex items-center gap-1.5 h-[36px] sm:h-[32px] min-w-[130px] whitespace-nowrap">
                            <lucide-icon name="folders" icon-class="w-3.5 h-3.5"></lucide-icon>
                            <span>{{ categoryFilterLabel }}</span>
                            <lucide-icon name="chevron-down" icon-class="w-3 h-3 ml-1"></lucide-icon>
                        </button>
                        <div v-show="categoryFilterOpen" class="fixed bg-notion-bg border border-notion-border rounded-md shadow-lg min-w-[190px] py-1 z-[200] max-h-64 overflow-y-auto" :style="{ top: categoryFilterPos.y + 'px', left: categoryFilterPos.x + 'px' }">
                            <div class="flex items-center justify-between gap-2 px-3 py-1 border-b border-notion-divider mb-1">
                                <button @click.stop="selectAllCategories" class="text-[10px] text-notion-accent hover:text-notion-accent/80 transition-colors">Select All</button>
                                <button @click.stop="clearCategorySelection" class="text-[10px] text-notion-text-tertiary hover:text-notion-text-primary transition-colors">Reset</button>
                            </div>
                            <label v-for="cat in availableCategories" :key="cat.value" @click.stop class="flex items-center gap-2.5 px-3 py-1.5 text-xs text-notion-text-primary hover:bg-notion-bg-hover cursor-pointer transition-colors">
                                <input type="checkbox" :checked="isCategoryChecked(cat.value)" @change="toggleCategorySelection(cat.value, $event.target.checked)" class="w-3.5 h-3.5 rounded border-notion-border bg-notion-bg-secondary text-notion-accent" />
                                <span class="flex-1">{{ cat.label }}</span>
                                <span class="text-[10px] text-notion-text-tertiary tabular-nums">{{ cat.count }}</span>
                            </label>
                        </div>
                    </div>

                    <!-- Filter Mode Dropdown -->
                    <div v-show="filterModeOpen" class="fixed inset-0 z-[190]" @click="filterModeOpen = false"></div>
                    <div>
                        <button
                            @click="openFilterMode($event)"
                            :class="filterMode.length > 0 ? 'border-notion-accent text-notion-accent' : 'border-notion-border text-notion-text-secondary'"
                            class="px-3 py-1.5 bg-notion-bg-secondary border rounded-md text-xs hover:bg-notion-bg-hover transition-colors flex items-center gap-1.5 h-[36px] sm:h-[32px] min-w-[90px] whitespace-nowrap">
                            <lucide-icon name="filter" icon-class="w-3.5 h-3.5"></lucide-icon>
                            <span>{{ filterModeLabel }}</span>
                            <lucide-icon name="chevron-down" icon-class="w-3 h-3 ml-1"></lucide-icon>
                        </button>
                        <div v-show="filterModeOpen" class="fixed bg-notion-bg border border-notion-border rounded-md shadow-lg min-w-[160px] py-1 z-[200]" :style="{ top: filterModePos.y + 'px', left: filterModePos.x + 'px' }">
                            <label
                                v-for="opt in filterModeOptions"
                                :key="opt.value"
                                class="flex items-center gap-2.5 px-3 py-1.5 text-xs text-notion-text-primary hover:bg-notion-bg-hover cursor-pointer transition-colors">
                                <input type="checkbox" :value="opt.value" v-model="filterMode" class="w-3.5 h-3.5 rounded border-notion-border bg-notion-bg-secondary text-notion-accent" />
                                <span>{{ opt.label }}</span>
                            </label>
                        </div>
                    </div>

                    <!-- Bulk Select Dropdown -->
                    <div v-show="bulkSelectOpen" class="fixed inset-0 z-[190]" @click="bulkSelectOpen = false"></div>
                    <div>
                        <button
                            ref="bulkSelectButton"
                            @click="openBulkSelect($event)"
                            :disabled="bulkSelectCategories.length === 0"
                            :class="bulkSelectCategories.length > 0 ? 'border-notion-accent text-notion-accent' : 'border-notion-border text-notion-text-secondary opacity-60 cursor-not-allowed'"
                            class="px-3 py-1.5 bg-notion-bg-secondary border rounded-md text-xs hover:bg-notion-bg-hover transition-colors flex items-center gap-1.5 h-[36px] sm:h-[32px] min-w-[128px] whitespace-nowrap">
                            <lucide-icon name="list-checks" icon-class="w-3.5 h-3.5"></lucide-icon>
                            <span>{{ bulkSelectLabel }}</span>
                            <lucide-icon name="chevron-down" icon-class="w-3 h-3 ml-1"></lucide-icon>
                        </button>
                        <div v-show="bulkSelectOpen" class="fixed bg-notion-bg border border-notion-border rounded-md shadow-lg min-w-[230px] py-1 z-[200] max-h-72 overflow-y-auto" :style="{ top: bulkSelectPos.y + 'px', left: bulkSelectPos.x + 'px' }">
                            <div class="flex items-center justify-between gap-2 px-3 py-1 border-b border-notion-divider mb-1">
                                <button @click.stop="selectAllBulkSelectCategories" class="text-[10px] text-notion-accent hover:text-notion-accent/80 transition-colors">Select All</button>
                                <button @click.stop="clearBulkSelectSelection" class="text-[10px] text-notion-text-tertiary hover:text-notion-text-primary transition-colors">Reset</button>
                            </div>
                            <label
                                v-for="cat in bulkSelectCategories"
                                :key="cat.value"
                                @click.stop
                                class="flex items-center gap-2.5 px-3 py-1.5 text-xs text-notion-text-primary hover:bg-notion-bg-hover cursor-pointer transition-colors w-full text-left">
                                <input type="checkbox" :checked="isBulkSelectCategoryChecked(cat.value)" @change="toggleBulkSelectCategory(cat.value, $event.target.checked)" class="w-3.5 h-3.5 rounded border-notion-border bg-notion-bg-secondary text-notion-accent" />
                                <span class="flex-1">{{ cat.label }}</span>
                                <span class="text-[10px] text-notion-text-tertiary tabular-nums">{{ cat.count }}</span>
                            </label>
                            <div class="px-3 pt-2 pb-1 border-t border-notion-divider mt-1">
                                <div class="grid grid-cols-1 gap-1.5">
                                    <button @click.stop="applyBulkSelectSelection('select')" class="w-full px-3 py-1.5 bg-notion-bg-hover border border-notion-border text-notion-text-secondary rounded-md text-xs hover:bg-notion-bg-active transition-colors flex items-center justify-center gap-1.5">
                                        <lucide-icon name="check-square" icon-class="w-3.5 h-3.5"></lucide-icon>
                                        <span>Select Items</span>
                                    </button>
                                    <button @click.stop="applyBulkSelectSelection('stage')" class="w-full px-3 py-1.5 bg-notion-info/10 border border-notion-info/30 text-notion-info rounded-md text-xs hover:bg-notion-info/15 transition-colors flex items-center justify-center gap-1.5">
                                        <lucide-icon name="list-plus" icon-class="w-3.5 h-3.5"></lucide-icon>
                                        <span>Add to Staging</span>
                                    </button>
                                    <button @click.stop="applyBulkSelectSelection('force')" class="w-full px-3 py-1.5 bg-notion-warning/10 border border-notion-warning/30 text-notion-warning rounded-md text-xs hover:bg-notion-warning/15 transition-colors flex items-center justify-center gap-1.5">
                                        <lucide-icon name="zap" icon-class="w-3.5 h-3.5"></lucide-icon>
                                        <span>Force Upload</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Collapse All -->
                <button @click="collapseAll()" title="Collapse all sections" class="px-3 py-1.5 bg-notion-bg-hover border border-notion-border text-notion-text-secondary rounded-md text-xs hover:bg-notion-bg-active transition-colors flex items-center gap-1.5 h-[36px] sm:h-[32px]">
                    <lucide-icon name="minimize-2" icon-class="w-3.5 h-3.5"></lucide-icon>
                    <span class="hidden sm:inline">Collapse All</span>
                </button>

                <div class="hidden sm:flex-1 sm:block"></div>

                <!-- Cache age indicator -->
                <span v-if="cacheAge" class="text-[10px] text-notion-text-tertiary font-mono">{{ cacheAge }}</span>

                <!-- Selected indicator -->
                <span v-if="selectedCount > 0" class="text-[10px] text-notion-accent font-semibold uppercase tracking-wider">{{ selectedSummaryLabel }}</span>
            </div>

            <!-- Anime detecting banner -->
            <div v-if="animeDetecting" class="flex items-center gap-2 px-3 py-1.5 bg-notion-accent/10 border-b border-notion-divider text-notion-text-secondary text-xs">
                <lucide-icon name="loader" icon-class="w-3.5 h-3.5 text-notion-accent animate-spin"></lucide-icon>
                <span>Identifying anime titles via Jikan (MyAnimeList) â€” badges will update automatically&hellip;</span>
            </div>
