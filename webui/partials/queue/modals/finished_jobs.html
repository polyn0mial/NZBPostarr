<!-- Finished Jobs Modal (Show All) -->
<modal
    :open="showFinishedModal"
    title="All Finished Jobs"
    icon="check-circle"
    icon-class="text-notion-success"
    :badge="finished.length"
    max-width="max-w-2xl"
    panel-class="bg-notion-bg-secondary max-h-[80vh]"
    @close="showFinishedModal = false">
    <template #header-actions>
        <button @click="clearFinished()" class="text-xs text-notion-text-tertiary hover:text-notion-error transition-colors">Clear All</button>
    </template>
    <div class="overflow-y-auto divide-y divide-notion-divider">
        <div v-for="job in finished" :key="job.job_id" class="flex items-center gap-4 px-4 py-2 bg-notion-bg hover:bg-notion-bg-hover transition-colors group">
            <div :class="finishedStatusBg(job)" class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0">
                <lucide-icon :name="getStatusConfig(job.status).icon" :icon-class="'w-3.5 h-3.5 ' + getStatusConfig(job.status).color"></lucide-icon>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium text-notion-text-primary truncate">{{ jobDisplayName(job) }}</span>
                    <span :class="finishedStatusBadge(job)" class="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded">{{ job.status }}</span>
                    <span v-if="job.test_mode" class="bg-notion-warning/20 text-notion-warning rounded font-bold px-1.5 py-0.5 text-[10px]">TEST</span>
                </div>
                <div class="flex items-center gap-2 text-[10px] text-notion-text-tertiary mt-0.5">
                    <span class="font-mono">{{ job.job_id }}</span>
                    <span class="opacity-60">&bull;</span>
                    <span>{{ job.items_processed || 0 }}/{{ job.items_total || 0 }} items</span>
                    <template v-if="job.summary && job.summary.duration">
                        <span class="opacity-60">&bull;</span>
                        <span>{{ job.summary.duration }}</span>
                    </template>
                    <template v-if="job.total_bytes > 0">
                        <span class="opacity-60">&bull;</span>
                        <span>{{ formatBytes(job.total_bytes) }}</span>
                    </template>
                    <template v-if="job.attempt_count > 1">
                        <span class="opacity-60">&bull;</span>
                        <span>attempt {{ job.attempt_count }}</span>
                    </template>
                    <template v-if="job.finished_at">
                        <span class="opacity-60">&bull;</span>
                        <span>{{ formatDate(job.finished_at) }}</span>
                    </template>
                </div>
                <div v-if="job.last_error" class="text-[10px] text-notion-error truncate mt-0.5" :title="job.last_error">{{ job.last_error }}</div>
            </div>
            <button v-if="job.retry_eligible" @click="retryJob(job)" :disabled="isJobActionPending(job.job_id)" class="p-1.5 rounded hover:bg-notion-accent/10 text-notion-text-tertiary hover:text-notion-accent transition-colors disabled:opacity-40 shrink-0" title="Retry Failed Job">
                <lucide-icon name="rotate-ccw" icon-class="w-4 h-4"></lucide-icon>
            </button>
            <button @click="renameJobInline(job)" class="p-1.5 rounded hover:bg-notion-info/10 text-notion-text-tertiary hover:text-notion-info transition-colors opacity-0 group-hover:opacity-100 shrink-0" title="Rename Job">
                <lucide-icon name="pencil" icon-class="w-4 h-4"></lucide-icon>
            </button>
            <button @click="deleteJob(job.job_id)" class="p-1.5 rounded hover:bg-notion-error/10 text-notion-text-tertiary hover:text-notion-error transition-colors opacity-0 group-hover:opacity-100 shrink-0" title="Dismiss">
                <lucide-icon name="x" icon-class="w-4 h-4"></lucide-icon>
            </button>
        </div>
    </div>
</modal>
