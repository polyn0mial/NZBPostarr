<!-- Bulk Upload Preview Modal -->
<modal
    :open="showBulkPreviewModal"
    :title="bulkPreviewMode === 'staging' ? 'Review Staged Queue Plan' : 'Review Bulk Upload Plan'"
    :subtitle="`Destination: ${bulkPreviewIndexerName || 'all indexers'}`"
    icon="list-checks"
    max-width="max-w-4xl"
    panel-class="bg-notion-bg-secondary max-h-[88vh]"
    :close-disabled="bulkPreviewStarting"
    @close="closeBulkPreviewModal()">
    <div v-if="bulkPreviewLoading" class="px-4 py-16 text-center text-notion-text-tertiary">
        <lucide-icon name="loader-2" icon-class="w-6 h-6 animate-spin mx-auto mb-3 text-notion-accent"></lucide-icon>
        <p class="text-sm text-notion-text-secondary">Checking paths, limits, duplicates, and destinations...</p>
    </div>

    <template v-else-if="bulkPreview">
        <div class="p-4 space-y-4 overflow-y-auto">
            <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2">
                <div class="rounded-md border border-notion-border bg-notion-bg p-2.5">
                    <p class="text-[10px] uppercase tracking-wider text-notion-text-tertiary">Selected</p>
                    <p class="text-lg font-semibold text-notion-text-primary">{{ bulkPreview.selection?.matched || bulkPreviewSummary.selected || 0 }}</p>
                </div>
                <div class="rounded-md border border-notion-success/30 bg-notion-success/5 p-2.5">
                    <p class="text-[10px] uppercase tracking-wider text-notion-success">Ready</p>
                    <p class="text-lg font-semibold text-notion-success">{{ bulkPreviewSummary.ready || 0 }}</p>
                </div>
                <div class="rounded-md border border-notion-info/30 bg-notion-info/5 p-2.5">
                    <p class="text-[10px] uppercase tracking-wider text-notion-info">Duplicates</p>
                    <p class="text-lg font-semibold text-notion-info">{{ bulkPreviewSummary.duplicate || 0 }}</p>
                </div>
                <div class="rounded-md border border-notion-border bg-notion-bg p-2.5">
                    <p class="text-[10px] uppercase tracking-wider text-notion-text-tertiary">Excluded</p>
                    <p class="text-lg font-semibold text-notion-text-secondary">{{ (bulkPreviewSummary.excluded || 0) + (bulkPreview.selection?.bulk_excluded || 0) }}</p>
                </div>
                <div class="rounded-md border border-notion-warning/30 bg-notion-warning/5 p-2.5">
                    <p class="text-[10px] uppercase tracking-wider text-notion-warning">Invalid</p>
                    <p class="text-lg font-semibold text-notion-warning">{{ bulkPreviewSummary.invalid || 0 }}</p>
                </div>
                <div class="rounded-md border border-notion-error/30 bg-notion-error/5 p-2.5">
                    <p class="text-[10px] uppercase tracking-wider text-notion-error">Blocked</p>
                    <p class="text-lg font-semibold text-notion-error">{{ bulkPreviewSummary.blocked || 0 }}</p>
                </div>
                <div class="rounded-md border border-notion-border bg-notion-bg p-2.5">
                    <p class="text-[10px] uppercase tracking-wider text-notion-text-tertiary">Ready Size</p>
                    <p class="text-sm font-semibold text-notion-text-primary mt-1">{{ formatBytes(bulkPreviewSummary.ready_bytes || 0) }}</p>
                </div>
            </div>

            <div v-if="bulkPreview.duplicate_check_bypassed" class="flex items-start gap-2 rounded-md border border-notion-warning/30 bg-notion-warning/5 px-3 py-2 text-xs text-notion-warning">
                <lucide-icon name="triangle-alert" icon-class="w-4 h-4 mt-0.5 shrink-0"></lucide-icon>
                Duplicate checking is bypassed for this run; previously uploaded destinations are included in the ready count.
            </div>

            <div v-if="(bulkPreview.selection?.bulk_excluded || 0) > 0 || (bulkPreview.selection?.overlapping_paths || 0) > 0" class="rounded-md border border-notion-border bg-notion-bg px-3 py-2 text-xs text-notion-text-secondary">
                <span v-if="(bulkPreview.selection?.bulk_excluded || 0) > 0">{{ bulkPreview.selection.bulk_excluded }} item(s) were removed by mass-selection exclusions.</span>
                <span v-if="(bulkPreview.selection?.bulk_excluded || 0) > 0 && (bulkPreview.selection?.overlapping_paths || 0) > 0"> </span>
                <span v-if="(bulkPreview.selection?.overlapping_paths || 0) > 0">{{ bulkPreview.selection.overlapping_paths }} overlapping parent path(s) were consolidated.</span>
            </div>

            <div v-if="bulkPreviewDestinations.length > 0">
                <h4 class="text-[10px] uppercase tracking-wider text-notion-text-tertiary mb-1.5">Destination Coverage</h4>
                <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">
                    <div v-for="destination in bulkPreviewDestinations" :key="destination.id" class="rounded-md border border-notion-border bg-notion-bg px-3 py-2 flex items-center justify-between gap-3">
                        <span class="text-xs text-notion-text-primary truncate">{{ destination.name }}</span>
                        <span class="text-[10px] text-notion-text-tertiary whitespace-nowrap">{{ destination.pending }} pending / {{ destination.uploaded }} uploaded</span>
                    </div>
                </div>
            </div>

            <div v-if="bulkPreviewNonReadyItems.length > 0">
                <div class="flex items-center justify-between gap-3 mb-1.5">
                    <h4 class="text-[10px] uppercase tracking-wider text-notion-text-tertiary">Items Not Ready</h4>
                    <span class="text-[10px] text-notion-text-tertiary">First {{ bulkPreviewNonReadyItems.length }}</span>
                </div>
                <div class="rounded-md border border-notion-border divide-y divide-notion-divider max-h-64 overflow-y-auto">
                    <div v-for="item in bulkPreviewNonReadyItems" :key="item.path + ':' + item.outcome" class="px-3 py-2 flex items-start gap-3 bg-notion-bg">
                        <span
                            class="mt-0.5 px-1.5 py-0.5 rounded text-[9px] font-bold uppercase shrink-0"
                            :class="item.outcome === 'duplicate' ? 'bg-notion-info/15 text-notion-info' : (item.outcome === 'blocked' ? 'bg-notion-error/15 text-notion-error' : (item.outcome === 'invalid' ? 'bg-notion-warning/15 text-notion-warning' : 'bg-notion-bg-hover text-notion-text-secondary'))">
                            {{ item.outcome }}
                        </span>
                        <div class="min-w-0">
                            <p class="text-xs text-notion-text-primary truncate" :title="item.path">{{ item.name || item.path || 'Unknown item' }}</p>
                            <p class="text-[10px] text-notion-text-tertiary">{{ item.reason || 'Excluded by upload rules' }}</p>
                        </div>
                    </div>
                </div>
                <p v-if="bulkPreview.details_truncated" class="text-[10px] text-notion-text-tertiary mt-1">The full plan is larger than the preview detail limit.</p>
            </div>
        </div>

        <div class="px-4 py-3 border-t border-notion-divider flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 shrink-0">
            <p class="text-[10px] text-notion-text-tertiary">
                {{ bulkPreviewMode === 'staging' ? 'Starting removes runnable items from staging after the job is created.' : 'Starting creates one job; upload rules are rechecked when each item runs.' }}
            </p>
            <div class="flex items-center justify-end gap-2">
                <button @click="closeBulkPreviewModal" :disabled="bulkPreviewStarting" class="px-4 py-1.5 text-xs text-notion-text-secondary hover:text-notion-text-primary disabled:opacity-40 transition-colors">Cancel</button>
                <button
                    @click="confirmBulkPreviewUpload"
                    :disabled="!bulkPreviewCanStart || bulkPreviewStarting"
                    class="btn-primary px-4 py-1.5 rounded-md text-xs font-medium flex items-center gap-1.5">
                    <lucide-icon :name="bulkPreviewStarting ? 'loader-2' : 'play'" :icon-class="'w-3.5 h-3.5 ' + (bulkPreviewStarting ? 'animate-spin' : '')"></lucide-icon>
                    {{ bulkPreviewStarting ? 'Starting...' : `Start ${bulkPreviewSummary.ready || 0} Ready Item(s)` }}
                </button>
            </div>
        </div>
    </template>
</modal>
