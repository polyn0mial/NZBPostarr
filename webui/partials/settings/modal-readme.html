<!-- Readme Editor Modal -->
<modal
    :open="showReadmeModal"
    title="Readme Editor"
    :subtitle="readmeFilePath"
    subtitle-class="font-mono"
    icon="file-text"
    max-width="max-w-3xl"
    panel-class="bg-notion-bg-secondary max-h-[90vh]"
    @close="closeReadmeModal()">
    <template #header-actions>
        <div v-if="readmeDirty" class="flex items-center gap-1.5 text-amber-500">
            <div class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></div>
            <span class="text-[10px] font-medium">Unsaved changes</span>
        </div>
    </template>

    <!-- Editor -->
    <div class="flex-1 overflow-hidden p-4 min-h-0">
        <div class="relative h-full min-h-100 rounded border overflow-hidden" :class="readmeDirty ? 'border-amber-500/40' : 'border-notion-border'">
            <textarea
                v-model="readmeContent"
                wrap="off"
                class="absolute inset-0 w-full h-full bg-notion-bg font-mono text-xs p-4 text-notion-text-primary focus:outline-none resize-none caret-amber-500"
                style="line-height: 1.45rem; tab-size: 2; white-space: pre"
                spellcheck="false"
                placeholder="Enter readme content here..."></textarea>
        </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-notion-border flex items-center justify-between gap-4 bg-notion-bg/30 shrink-0">
        <button v-if="readmeDirty" @click="readmeContent = readmeOriginal" class="text-xs text-notion-text-tertiary hover:text-notion-error transition-colors flex items-center gap-1.5">
            <lucide-icon name="rotate-ccw" icon-class="size-3.5"></lucide-icon>
            Discard changes
        </button>
        <span v-else class="text-[10px] text-notion-text-tertiary">Edit the readme.txt above - included in all uploads when enabled</span>
        <div class="flex items-center gap-3 ml-auto">
            <button @click="closeReadmeModal()" class="px-4 h-9 text-xs text-notion-text-secondary hover:text-notion-text-primary transition-colors font-medium">Close</button>
            <button
                @click="saveReadme()"
                :disabled="!readmeDirty"
                :class="['px-6 h-9 rounded-md text-xs font-bold transition-all flex items-center gap-2', readmeDirty ? 'bg-amber-500 hover:bg-amber-600 text-white' : 'bg-notion-bg-hover text-notion-text-tertiary cursor-not-allowed opacity-50']">
                <lucide-icon name="save" icon-class="size-3.5"></lucide-icon>
                Save Readme
            </button>
        </div>
    </div>
</modal>
