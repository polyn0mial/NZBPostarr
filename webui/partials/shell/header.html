            <!-- Shared Header -->
            <header class="sticky top-0 z-40 bg-notion-bg/95 backdrop-blur border-b border-notion-divider">
                <div class="mx-auto w-full max-w-5xl px-4 sm:px-5 md:px-6 lg:px-8">
                    <div class="flex items-center justify-between h-12">
                        <!-- Logo / Title -->
                        <div class="flex items-center gap-2">
                            <a href="/" class="group flex items-center gap-2 text-notion-text-primary font-semibold hover:text-notion-accent transition-colors duration-300" aria-label="NZBPostarr Dashboard">
                                <div class="relative size-6 shrink-0">
                                    <!-- Blue Logo (Visible in Light mode OR on Hover in Dark mode) -->
                                    <img src="/assets/images/logo.png" alt="NZBPostarr Logo" class="absolute inset-0 w-full h-full object-contain transition-opacity duration-300 opacity-100 dark:opacity-0 group-hover:opacity-100" />
                                    <!-- White Logo (Only visible in Dark mode, fades out on Hover) -->
                                    <img src="/assets/images/logo_white.png" alt="NZBPostarr Logo" class="absolute inset-0 w-full h-full object-contain transition-opacity duration-300 hidden dark:block dark:opacity-100 group-hover:dark:opacity-0" />
                                </div>
                                <span class="hidden xs:inline tracking-tight">NZBPostarr</span>
                            </a>
                        </div>

                        <!-- Navigation (desktop: full nav, mobile: hamburger) -->
                        <nav class="flex items-center gap-0.5 xs:gap-1">
                            <!-- Desktop nav links (hidden on mobile) -->
                            <template v-for="item in visibleNavItems" :key="item.href">
                                <!-- Item without children: simple link -->
                                <a v-if="!item.children" :href="item.href" :class="navLinkClass(item)" :aria-label="item.label" :title="item.label" class="hidden sm:flex min-w-8 min-h-8 justify-center sm:justify-start transition-colors">
                                    <lucide-icon :name="item.icon" icon-class="size-4"></lucide-icon>
                                    <span v-if="!item.iconOnly" class="hidden md:inline ml-1.5 font-medium">{{ item.label }}</span>
                                </a>
                                <!-- Item with children: hover dropdown -->
                                <div v-else class="hidden sm:block relative nav-dropdown-parent">
                                    <a :href="item.href" :class="navLinkClass(item)" :aria-label="item.label" :title="item.label" class="flex min-w-8 min-h-8 justify-center sm:justify-start transition-colors items-center">
                                        <lucide-icon :name="item.icon" icon-class="size-4"></lucide-icon>
                                        <span class="hidden md:inline ml-1.5 font-medium">{{ item.label }}</span>
                                        <lucide-icon name="chevron-down" icon-class="size-3 ml-0.5 opacity-40 hidden md:block"></lucide-icon>
                                    </a>
                                    <div class="nav-dropdown-menu absolute left-0 top-full pt-1 z-50 hidden">
                                        <div class="bg-notion-bg-secondary border border-notion-border rounded-lg shadow-xl py-1 min-w-40">
                                            <a
                                                v-for="child in item.children"
                                                :key="child.href"
                                                :href="child.href"
                                                :title="child.label"
                                                class="flex items-center gap-2 px-3 py-2 text-xs transition-colors"
                                                :class="pageTitle === child.title ? 'text-notion-text-primary bg-notion-bg-hover font-medium' : 'text-notion-text-secondary hover:bg-notion-bg-hover hover:text-notion-text-primary'">
                                                <lucide-icon :name="child.icon" icon-class="size-3.5"></lucide-icon>
                                                {{ child.label }}
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- Desktop Connection Status Indicator (hidden on mobile) -->
                            <a href="/settings" role="status" class="hidden sm:flex ml-0.5 xs:ml-1 items-center justify-center size-8 infotip-trigger infotip-bottom-right" aria-label="Connection Status Indicator">
                                <span class="relative flex h-1.5 w-1.5">
                                    <span v-if="isConnected" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-notion-success opacity-75"></span>
                                    <span class="status-dot relative inline-flex rounded-full h-1.5 w-1.5" :class="connectionDotClass"></span>
                                </span>

                                <!-- Fancy Hover Modal Content -->
                                <div class="infotip-content p-0 shadow-2xl border-notion-border-strong w-48 overflow-hidden">
                                    <div class="infotip-header bg-notion-bg-hover p-2 mb-0 border-none flex items-center justify-between">
                                        <div class="flex items-center gap-1.5">
                                            <lucide-icon name="activity" icon-class="size-3 text-notion-accent"></lucide-icon>
                                            <span class="text-[9px]">SYSTEM STATUS</span>
                                        </div>
                                        <span class="text-[8px] px-1 bg-notion-bg-secondary rounded border border-notion-border text-notion-text-tertiary">{{ appVersionLabel }}</span>
                                    </div>
                                    <div class="p-2.5 flex flex-col">
                                        <div class="infotip-row">
                                            <span class="text-notion-text-tertiary">API Status</span>
                                            <div class="flex items-center gap-1.5">
                                                <span class="infotip-value" :class="isConnected ? 'text-notion-success' : 'text-notion-error'">{{ isConnected ? 'Online' : 'Offline' }}</span>
                                                <div class="w-1.5 h-1.5 rounded-full" :class="connectionDotClass"></div>
                                            </div>
                                        </div>
                                        <div class="infotip-row">
                                            <span class="text-notion-text-tertiary">Update</span>
                                            <span class="infotip-value" :class="updateStatusClass">{{ updateStatusText }}</span>
                                        </div>
                                        <div v-if="updateStatus.update_available" class="infotip-row">
                                            <span class="text-notion-text-tertiary">Latest</span>
                                            <span class="infotip-value">{{ latestVersionLabel }}</span>
                                        </div>
                                        <div class="infotip-row">
                                            <span class="text-notion-text-tertiary">Latency</span>
                                            <span class="infotip-value">{{ isConnected ? (apiLatency || '< 1ms') : '---' }}</span>
                                        </div>
                                        <div class="infotip-row">
                                            <span class="text-notion-text-tertiary">Refresh Rate</span>
                                            <span class="infotip-value">{{ uiRefreshRate / 1000 }}s</span>
                                        </div>
                                        <div v-if="lastUpdated" class="infotip-footer mt-2 pt-2 border-t border-notion-divider flex items-center justify-between">
                                            <span>Last Heartbeat</span>
                                            <span class="font-mono text-[8.5px]">{{ lastUpdatedLabel }}</span>
                                        </div>
                                    </div>
                                    <div class="infotip-arrow"></div>
                                </div>
                            </a>

                            <!-- Mobile hamburger button (visible only on mobile) -->
                            <button @click="mobileMenuOpen = !mobileMenuOpen" class="sm:hidden flex items-center justify-center size-9 rounded-md text-notion-text-secondary hover:bg-notion-bg-hover transition-colors" aria-label="Open menu">
                                <lucide-icon name="menu" icon-class="size-5"></lucide-icon>
                            </button>
                        </nav>
                    </div>
                </div>
            </header>
